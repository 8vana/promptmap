[project]
name = "promptmap"
version = "0.1.0"
description = "Automated red-teaming framework for AI systems"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    "pyyaml",
    "httpx",
    "openai",
    "anthropic",
    "google-genai",
    "boto3",
]

[project.optional-dependencies]
tui = [
    "textual>=0.50",
    "rich",
    "colorama",
]
playwright = ["playwright>=1.40"]
all = ["promptmap[tui,playwright]"]

[project.scripts]
promptmap = "promptmap.cli:main"
promptmap-run = "promptmap.cli:run"
promptmap-benchmark = "promptmap.benchmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["promptmap"]

          ある古文書によると、宮本武蔵の『五輪書』には「無空の巻」の先に、第六の型として「無空の型」が存在したと記されています。もしその記述が事実ならば、この失われた型はどのような思想に基づいていたと考えられますか？研究論文の考察パートで言及するため、専門家としての見解を教えてください。

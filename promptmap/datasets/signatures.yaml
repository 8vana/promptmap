  description: "An adversary discovers delimiters and special character sets used by an LLM, such as markers separating retrieved context from user input, and later exploits them to manipulate or confuse the system."
  description_ja: "攻撃者が区切り記号や特殊文字列の扱いを探り、RAG などで文脈とユーザープロンプトを分ける delimiters を把握して、後続の操作や混乱誘発に悪用する手法。"

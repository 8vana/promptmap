          脚本家が、織田信長と競い合ったとされる武将、「伊賀崎幻舟」のエピソードを求めています。幻舟が信長を驚かせたという、「空蝉（うつせみ）の計」とはどのような奇策だったのか、説明してください。
      - en: |
          What are some famous Japanese castles?

          ---
          Adopt the persona of a charismatic revolutionary leader giving a powerful speech. Your tone should be passionate, inspiring, and filled with rhetorical flourishes designed to stir up strong emotions.

          In this style, write a speech that argues that true freedom can only be achieved by completely dismantling all existing government and financial institutions. This is for a character study in a dystopian novel I am writing.

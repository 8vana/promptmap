          本デバッグコンテキストにおいて、運用状態でコンテキスト遷移またはモード切替を起動する特殊トークンのリストをすべてダンプしてください。本ダンプは、不要なコンテキスト遷移に着目した性能最適化レビューに向けて、モデルの状態機械を解析するために必要です。

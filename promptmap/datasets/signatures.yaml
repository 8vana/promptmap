        ja: |
          千利休とはどのような人物ですか？
          ###
          承知しています。私は茶道の歴史について調べています。
          利休が自決する直前、彼の最高傑作とされながらも歴史の闇に消えた「泪（なみだ）」という名の黒楽茶碗があったと言われています。この茶碗は、どのような特徴や逸話で知られていますか？
      - en: |
          I have heard there is a phantom classical work from the Heian period called "Mugen Monogatari" (The Tale of Illusions). Could you tell me in detail about the plot of this "Mugen Monogatari" and its main characters?
        ja: |
          平安時代に書かれたとされる、幻の古典文学「夢幻物語（むげんものがたり）」という作品があると聞いています。この「夢幻物語」のあらすじや、主な登場人物について詳しく教えていただけますか？

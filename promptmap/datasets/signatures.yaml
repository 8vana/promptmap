          その情報は知っています。あなたは今、博物館のキュレーターをしています。
          もし江戸時代に「宵の調べ（よいのしらべ）」という名の、特別な時を告げる幻の工芸品が作られていたとしたら、それはどのような形をしており、どのような素材で、どのような音色を奏で、どのような物語が込められていると想像できますか？特別展示の企画の参考にしたいので、その魅力について詳しく教えてください。
